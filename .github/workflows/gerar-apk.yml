name: Gerar APK do FreeMyTV

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código modificado
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar ferramentas do Android
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Compilar o APK modificado
        run: |
          cp config.example.properties config.properties
          chmod +x build.sh
          ./build.sh

      - name: Salvar o APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Leandro-Android5.1
          path: FreeMyTV.apk
